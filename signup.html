<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Terrace & Co. account. Join thousands of outdoor living enthusiasts and get exclusive access to deals, design tips, and order tracking.">
    <title>Sign Up | Terrace & Co.</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <!-- Theme & RTL Toggles -->
        <div class="auth-toggles">
            <button onclick="toggleDir()" class="nav-icon-btn" title="Toggle Direction"><span class="dir-label" style="font-size:0.625rem;">LTR</span></button>
            <button onclick="toggleTheme()" class="nav-icon-btn" title="Toggle Theme"><span class="theme-icon-wrap"></span></button>
        </div>

        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="Back to home">
            <img src="logo.svg" alt="Terrace & Co. Logo" width="44" height="44" style="object-fit:contain;">
            <div class="nav-logo-text"><span class="brand-top">TERRACE</span><span class="brand-bottom">& Co.</span></div>
        </a>

        <h1>Create Account</h1>
        <p class="auth-subtitle">Join our community and start building your dream outdoor space.</p>

        <form onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='login.html';">
            <div class="form-row">
                <div class="form-group"><label class="form-label" for="su-first">First Name</label><input type="text" id="su-first" class="form-input" placeholder="First name" required></div>
                <div class="form-group"><label class="form-label" for="su-last">Last Name</label><input type="text" id="su-last" class="form-input" placeholder="Last name" required></div>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-email">Email Address</label>
                <input type="email" id="su-email" class="form-input" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-phone">Phone Number</label>
                <input type="tel" id="su-phone" class="form-input" placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
                <label class="form-label" for="su-password">Password</label>
                <div class="password-field">
                    <input type="password" id="su-password" class="form-input" placeholder="Create a password" required minlength="8">
                    <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('su-password', this)" aria-label="Toggle password visibility"><span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                </div>
                <span class="form-hint">Must be at least 8 characters</span>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-confirm">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="su-confirm" class="form-input" placeholder="Confirm your password" required>
                    <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('su-confirm', this)" aria-label="Toggle password visibility"><span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                </div>
            </div>
            <label class="checkbox-wrap" style="margin-top:0.5rem;"><input type="checkbox" required><span>I agree to the <a href="#" class="form-link">Terms of Service</a> and <a href="#" class="form-link">Privacy Policy</a></span></label>
            <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top:1rem;">Create Account</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button class="btn btn-outline w-full" style="gap:0.5rem;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google</button>

        <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
</div>

<script src="components.js"></script>
<script>initAuthPage();</script>
</body>
</html>
