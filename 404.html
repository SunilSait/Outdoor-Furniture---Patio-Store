<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — The page you're looking for doesn't exist. Return to Terrace & Co. homepage.">
    <title>404 — Page Not Found | Terrace & Co.</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }
        .error-page::before {
            content: '404';
            position: absolute;
            font-size: clamp(12rem, 30vw, 28rem);
            font-weight: 600;
            font-family: var(--ff-heading);
            color: var(--primary);
            opacity: 0.04;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            line-height: 1;
            pointer-events: none;
        }
        .error-content {
            max-width: 540px;
            z-index: 2;
        }
        .error-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            border: 3px solid var(--border);
        }
        .error-icon svg {
            width: 48px;
            height: 48px;
            color: var(--primary);
        }
        .error-content h1 {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            color: var(--text);
        }
        .error-content p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.0625rem;
        }
        .error-links {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-toggles {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-toggles">
        <button onclick="toggleDir()" class="nav-icon-btn" title="Toggle Direction"><span class="dir-label" style="font-size:0.625rem;">LTR</span></button>
        <button onclick="toggleTheme()" class="nav-icon-btn" title="Toggle Theme"><span class="theme-icon-wrap"></span></button>
    </div>
    <div class="error-content">
        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
                <line x1="9" y1="9" x2="9.01" y2="9"/>
                <line x1="15" y1="9" x2="15.01" y2="9"/>
            </svg>
        </div>
        <h1>Oops! Page Not Found</h1>
        <p>The outdoor space you're looking for seems to have moved. Let's get you back on track.</p>
        <div class="error-links">
            <a href="index.html" class="btn btn-primary btn-lg">Back to Home</a>
            <a href="products.html" class="btn btn-outline btn-lg">Browse Products</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>initAuthPage();</script>
</body>
</html>
