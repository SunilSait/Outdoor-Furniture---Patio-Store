<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something extraordinary is coming to Terrace & Co. Subscribe for updates on our newest luxury outdoor collections.">
    <title>Coming Soon | Terrace & Co. — Luxury Outdoor Furniture</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-width: 480px;
            margin: 2rem auto;
            width: 100%;
        }
        .countdown-item {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            box-shadow: var(--shadow-sm);
            border-radius: var(--radius-xl);
            padding: 1.25rem 0.75rem;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .dark .countdown-item {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }
        .countdown-value {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 2rem;
            color: var(--primary);
            line-height: 1.1;
            animation: countDown 2s ease-in-out infinite;
        }
        .countdown-label {
            font-size: 0.6875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.25rem;
            font-family: var(--font-heading);
            font-weight: 600;
        }
        .subscribe-form {
            display: flex;
            gap: 0.5rem;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }
        .subscribe-form input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            background: var(--bg-card);
            border: 1.5px solid var(--border-default);
            border-radius: var(--radius-lg);
            color: var(--text-heading);
            font-family: var(--font-body);
            font-size: 0.875rem;
            outline: none;
            transition: var(--transition-fast);
        }
        .subscribe-form input:focus {
            border-color: var(--primary);
        }
        .subscribe-form input::placeholder {
            color: var(--text-muted);
        }
        .dark .subscribe-form input {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.12);
            color: #fff;
        }
        .coming-title {
            color: var(--text-heading);
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 0.75rem;
        }
        .coming-desc {
            color: var(--text-body);
            font-size: 1rem;
            max-width: 440px;
            margin: 0 auto;
            line-height: 1.65;
        }
        .coming-socials {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2.5rem;
        }
        .coming-social-link {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--border-default);
            color: var(--text-body);
            background: var(--bg-card);
            transition: var(--transition-fast);
        }
        .coming-social-link:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-subtle);
        }
        .dark .coming-social-link {
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.5);
            background: transparent;
        }
        .dark .coming-social-link:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(139,105,20,0.15);
        }
        @media (max-width: 480px) {
            .countdown-grid {
                gap: 0.5rem;
                margin: 1.5rem auto;
            }
            .countdown-item {
                padding: 0.75rem 0.25rem;
                border-radius: var(--radius-lg);
            }
            .countdown-value {
                font-size: 1.35rem;
            }
            .countdown-label {
                font-size: 0.5625rem;
                letter-spacing: 0.05em;
            }
            .subscribe-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="Terrace & Co. Home">
        <img src="logo.svg" alt="Terrace & Co. Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;" />
        <div class="nav-logo-text">
            <span class="brand-top">TERRACE</span>
            <span class="brand-bottom">& Co.</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Decorative glow -->
        <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px, 90vw);height:min(450px, 90vw);background:radial-gradient(circle,rgba(139,105,20,0.08),transparent 65%);border-radius:50%;pointer-events:none;"></div>

        <div style="position:relative;z-index:2;">
            <div class="section-label" style="justify-content:center;margin-bottom:1rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                Launching Soon
            </div>
            <h1 class="coming-title">Something Beautiful Is Brewing</h1>
            <p class="coming-desc">
                We're crafting an exclusive new collection of bespoke outdoor living furniture. Subscribe to get notified on launch day!
            </p>

            <!-- Countdown -->
            <div class="countdown-grid" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-days">28</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-hours">14</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-mins">36</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-secs">52</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <!-- Subscribe -->
            <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this page launches.'); this.reset();">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>

            <!-- Social -->
            <div class="coming-socials">
                <a href="#" class="coming-social-link" aria-label="Facebook"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
                <a href="#" class="coming-social-link" aria-label="Instagram"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
                <a href="#" class="coming-social-link" aria-label="YouTube"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg></a>
            </div>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();

        // Live countdown timer (30 days from now)
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
            document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
</script>
</body>
</html>
