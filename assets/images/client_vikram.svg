<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2F2B" />
      <stop offset="50%" stop-color="#1B1F1C" />
      <stop offset="100%" stop-color="#121513" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#8B6914" />
      <stop offset="100%" stop-color="#5C450C" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9A066" />
      <stop offset="100%" stop-color="#B87D43" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D4540" />
      <stop offset="100%" stop-color="#1D221E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Clip Path for Avatar Content -->
  <clipPath id="avatarClip">
    <circle cx="60" cy="60" r="56.5" />
  </clipPath>

  <g clip-path="url(#avatarClip)">
    <!-- Subtle Inner Glow / Background Highlight -->
    <circle cx="60" cy="45" r="40" fill="#8B6914" opacity="0.15" />

    <!-- Shoulders & Suit Jacket -->
    <path d="M15 125 C 22 92, 40 82, 60 82 C 80 82, 98 92, 105 125 Z" fill="url(#suitGrad)" />

    <!-- Shirt Collar / V-neck -->
    <polygon points="60,98 48,82 72,82" fill="#E8ECE9" />
    <!-- Tie / Accent -->
    <polygon points="60,115 56,86 64,86" fill="url(#goldGrad)" />

    <!-- Suit Lapels -->
    <path d="M38 84 L52 105 L46 120 L30 92 Z" fill="#2E3530" />
    <path d="M82 84 L68 105 L74 120 L90 92 Z" fill="#232824" />

    <!-- Neck -->
    <path d="M52 68 L52 84 L68 84 L68 68 Z" fill="#B87D43" />
    <!-- Neck Shadow -->
    <path d="M52 74 C 56 79, 64 79, 68 74 L68 84 L52 84 Z" fill="#9E6732" opacity="0.4" />

    <!-- Head / Face -->
    <ellipse cx="60" cy="54" rx="19" ry="23" fill="url(#skinGrad)" />

    <!-- Hair -->
    <path d="M40 48 C 39 36, 48 30, 60 30 C 72 30, 81 36, 80 48 C 76 43, 72 41, 60 41 C 48 41, 44 43, 40 48 Z" fill="#1C1815" />
    <path d="M39 46 C 41 38, 47 33, 60 33 C 71 33, 79 37, 81 46 C 81 42, 79 36, 73 32 C 67 29, 53 29, 47 32 C 41 36, 39 42, 39 46 Z" fill="#2E2620" />

    <!-- Ears -->
    <ellipse cx="40" cy="54" rx="3.5" ry="6" fill="#B87D43" />
    <ellipse cx="80" cy="54" rx="3.5" ry="6" fill="#B87D43" />

    <!-- Well-Groomed Beard & Mustache Detail -->
    <path d="M46 56 C 48 68, 54 75, 60 75 C 66 75, 72 68, 74 56 C 73 63, 67 71, 60 71 C 53 71, 47 63, 46 56 Z" fill="#1F1A17" opacity="0.9" />
    <path d="M52 64 C 56 62, 64 62, 68 64 C 65 66, 55 66, 52 64 Z" fill="#1F1A17" />
  </g>
</svg>
